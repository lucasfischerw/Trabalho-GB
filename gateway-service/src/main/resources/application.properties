server.port=8005
spring.application.name=GATEWAY-SERVICE

spring.config.import=optional:configserver:http://localhost:8006

spring.cloud.gateway.server.webflux.routes[0].id=GITHUB-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://GITHUB-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/github/**

spring.cloud.gateway.server.webflux.routes[1].id=MISSAO-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MISSAO-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/missao/**

spring.cloud.gateway.server.webflux.routes[2].id=AUDITORIA-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AUDITORIA-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/auditoria/**

spring.cloud.gateway.server.webflux.routes[3].id=USUARIO-SERVICE
spring.cloud.gateway.server.webflux.routes[3].uri=lb://USUARIO-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/usuario/**

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

resilience4j.circuitbreaker.instances.githubServiceCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.githubServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.githubServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.githubServiceCircuitBreaker.waitDurationInOpenState=5000
resilience4j.circuitbreaker.instances.githubServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.githubServiceCircuitBreaker.slow-call-duration-threshold=10s
resilience4j.circuitbreaker.instances.githubServiceCircuitBreaker.slow-call-rate-threshold=80

resilience4j.circuitbreaker.instances.missaoServiceCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.missaoServiceCircuitBreaker.slidingWindowSize=1
resilience4j.circuitbreaker.instances.missaoServiceCircuitBreaker.failureRateThreshold=1
resilience4j.circuitbreaker.instances.missaoServiceCircuitBreaker.waitDurationInOpenState=5000
resilience4j.circuitbreaker.instances.missaoServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.missaoServiceCircuitBreaker.slow-call-duration-threshold=10s
resilience4j.circuitbreaker.instances.missaoServiceCircuitBreaker.slow-call-rate-threshold=80

management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,resilience-metrics
management.endpoint.health.show-details=always
