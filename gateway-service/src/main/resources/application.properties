server.port=8005
spring.application.name=GATEWAY-SERVICE

spring.config.import=optional:configserver:http://localhost:8006

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=github-service
spring.cloud.gateway.routes[0].uri=lb://GITHUB-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/github/**

spring.cloud.gateway.routes[1].id=missao-service
spring.cloud.gateway.routes[1].uri=lb://MISSAO-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/missao/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=missaoCircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/missao

spring.cloud.gateway.routes[2].id=auditoria-service
spring.cloud.gateway.routes[2].uri=lb://AUDITORIA-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/auditoria/**

spring.cloud.gateway.routes[3].id=usuario-service
spring.cloud.gateway.routes[3].uri=lb://USUARIO-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/usuario/**

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always