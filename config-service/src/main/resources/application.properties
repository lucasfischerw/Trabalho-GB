server.port=8006
spring.application.name=CONFIG-SERVICE

spring.cloud.config.server.git.uri=file://${user.home}/IdeaProjects/liga-desafios-microservices/config-repo
# OU se preferir usar um repositório no seu GitHub (como nos slides):
# spring.cloud.config.server.git.uri=https://github.com/SEU_USUARIO/liga-config-repo.git
spring.cloud.config.server.git.default-label=main

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus